const $=i=>document.getElementById(i);
const DEF_FOOTER='Nantawan Management Co., Ltd.\n10th Fl. O-NES Tower, Soi Sukhumvit 6, Klongtoey Sub-District, Klongtoey District, Bangkok 10110 Tel. 0-2651-8170-3';
const lsGet=k=>{try{return localStorage.getItem(k)}catch(e){return null}},lsSet=(k,v)=>{try{localStorage.setItem(k,v)}catch(e){}};
$('ftr').value=lsGet('thermify_footer')??DEF_FOOTER;
const sT=lsGet('thermify_title');if(sT)$('ttl').value=sT;
$('ttl').addEventListener('input',()=>lsSet('thermify_title',$('ttl').value));
$('ftr').addEventListener('input',()=>lsSet('thermify_footer',$('ftr').value));
let items=[],docName='Report',footer='';
const logm=h=>{$('log').innerHTML=h};const eh=s=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/"/g,'&quot;');
function render(){
  $('tb').innerHTML=items.map((t,i)=>`<tr><td>${t.n}</td><td><input type="text" data-i="${i}" data-k="floor" value="${eh(t.floor)}"></td><td><input class="tl" type="text" data-i="${i}" data-k="loc" value="${eh(t.loc)}"></td><td><input class="tl" type="text" data-i="${i}" data-k="dev" value="${eh(t.dev)}"></td><td><input class="tl" type="text" data-i="${i}" data-k="det" value="${eh(t.det)}"></td><td style="text-align:center">${t.level===''?'-':`<span class="lv lv${t.level}">${t.level}</span>`}</td><td><input type="text" data-i="${i}" data-k="page" value="${eh(t.page)}"></td></tr>`).join('');
  const c={1:0,2:0,3:0,4:0};items.forEach(t=>{if(t.level)c[t.level]++});
  const nm={1:'Normal',2:'Probable',3:'Monitor',4:'Major'};
  $('chips').innerHTML=`<span class="chip">${items.length} รายการ</span>`+[1,2,3,4].filter(k=>c[k]).map(k=>`<span class="chip l${k}">Level ${k} ${nm[k]}: ${c[k]}</span>`).join('');
}
async function load(file){
  $('c2').hidden=$('bar').hidden=true;logm('กำลังอ่านไฟล์…');
  try{
    if(typeof JSZip==='undefined')throw new Error('โหลดไลบรารี JSZip ไม่สำเร็จ — ต้องต่อเน็ตตอนเปิดหน้านี้ครั้งแรก แล้วรีเฟรชหน้า');
    if(!/\.xlsx$/i.test(file.name))throw new Error('รองรับเฉพาะไฟล์ .xlsx');
    let zip;try{zip=await JSZip.loadAsync(file)}catch(_){throw new Error('เปิดไฟล์ไม่ได้ — ไฟล์อาจเสียหรือไม่ใช่ .xlsx')}
    const r=await parseReport(zip);
    if(!r.items.length)throw new Error('ไม่พบข้อมูลอุปกรณ์ในไฟล์นี้');
    items=r.items;footer=r.footer||'';docName=file.name.replace(/\.xlsx$/i,'').replace(/[_ -]*Report$/i,'')||'Report';
    if(r.title&&lsGet('thermify_title')==null)$('ttl').value=r.title;if(r.footer&&lsGet('thermify_footer')==null)$('ftr').value=r.footer;render();$('c2').hidden=$('bar').hidden=false;
    logm('<span class="ok">✓ อ่านไฟล์สำเร็จ '+r.items.length+' รายการ</span>'+(r.blank.length?'<br><span class="w">! ไม่มีชื่อตำแหน่ง/อุปกรณ์ (ใส่ "-" ให้แล้ว แก้ไขได้ในตาราง): No. '+r.blank.join(', ')+'</span>':''));
  }catch(e){logm('<span class="w">เกิดข้อผิดพลาด: '+eh(e.message)+'</span>')}
}
$('f').addEventListener('click',()=>{$('f').value=''});
$('f').addEventListener('change',()=>{const f=$('f').files[0];if(f){$('dt').textContent=f.name;$('dn').textContent=(f.size/1048576).toFixed(1)+' MB · แตะเพื่อเปลี่ยนไฟล์';load(f)}});
const dz=$('drop');['dragenter','dragover'].forEach(v=>dz.addEventListener(v,e=>{e.preventDefault();dz.classList.add('on')}));
['dragleave','drop'].forEach(v=>dz.addEventListener(v,e=>{e.preventDefault();dz.classList.remove('on')}));
dz.addEventListener('drop',e=>{const f=e.dataTransfer.files[0];if(f){const d=new DataTransfer();d.items.add(f);$('f').files=d.files;$('f').dispatchEvent(new Event('change'))}});
$('tb').addEventListener('input',e=>{const i=e.target.dataset.i;if(i==null)return;const t=items[+i],k=e.target.dataset.k;
  t[k]=e.target.value});
$('go').onclick=async()=>{
  $('go').disabled=true;$('gt').textContent='กำลังสร้าง…';
  try{
    if(typeof JSZip==='undefined')throw new Error('ยังไม่ได้โหลด JSZip — ต่อเน็ตแล้วรีเฟรชหน้า');
    const blob=await buildSummary(JSZip,items,$('ttl').value.trim()||'Infrared Thermography Report',$('ftr').value,LOGO),a=document.createElement('a');
    a.href=URL.createObjectURL(blob);a.download=docName+'_Summary.xlsx';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),60000);
    logm('<span class="ok">✓ สร้างไฟล์ Summary เสร็จแล้ว — ไฟล์ถูกดาวน์โหลดอัตโนมัติ</span>');
  }catch(e){logm('<span class="w">เกิดข้อผิดพลาด: '+eh(e.message)+'</span>')}
  $('go').disabled=false;$('gt').textContent='สร้างไฟล์ Summary Excel';
};
