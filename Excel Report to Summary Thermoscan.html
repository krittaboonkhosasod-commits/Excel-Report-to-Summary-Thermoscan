<style>
:root{--tx:#000;--mu:rgba(60,60,67,.62);--sep:rgba(60,60,67,.18);--glass:rgba(255,255,255,.58);--glass2:rgba(255,255,255,.9);--fld:rgba(118,118,128,.12);--ac:#007aff;--acs:rgba(0,122,255,.14);--w:#c93400;--sh:rgba(20,30,80,.14);--bg1:#eef2ff;--bg2:#efe6fb;--bg3:#f9d5ea;--bg4:#c9f2d8;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--tx:#fff;--mu:rgba(235,235,245,.6);--sep:rgba(84,84,88,.6);--glass:rgba(40,40,48,.5);--glass2:rgba(44,44,50,.92);--fld:rgba(118,118,128,.24);--ac:#0a84ff;--acs:rgba(10,132,255,.22);--w:#ff9f0a;--sh:rgba(0,0,0,.5);--bg1:#0b1d3a;--bg2:#2a1450;--bg3:#4a1a3a;--bg4:#0a3a3a}}
:root[data-theme="dark"]{--tx:#fff;--mu:rgba(235,235,245,.6);--sep:rgba(84,84,88,.6);--glass:rgba(40,40,48,.5);--glass2:rgba(44,44,50,.92);--fld:rgba(118,118,128,.24);--ac:#0a84ff;--acs:rgba(10,132,255,.22);--w:#ff9f0a;--sh:rgba(0,0,0,.5);--bg1:#0b1d3a;--bg2:#2a1450;--bg3:#4a1a3a;--bg4:#0a3a3a}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{min-height:100%}
body{margin:0;min-height:100vh;color:var(--tx);font:17px/1.4 -apple-system,BlinkMacSystemFont,"SF Pro Text","SF Pro Display","Helvetica Neue","Segoe UI",system-ui,"Noto Sans Thai",Tahoma,sans-serif;-webkit-font-smoothing:antialiased;letter-spacing:-.01em;background:radial-gradient(60vmax 60vmax at 8% 4%,var(--bg1),transparent 60%),radial-gradient(55vmax 55vmax at 95% 12%,var(--bg2),transparent 60%),radial-gradient(60vmax 60vmax at 80% 100%,var(--bg3),transparent 60%),radial-gradient(55vmax 55vmax at 5% 95%,var(--bg4),transparent 60%),var(--bg1);background-attachment:fixed}
main{max-width:860px;margin:0 auto;padding:30px 16px 130px}
.hero{display:flex;align-items:center;gap:16px;padding:6px 6px 22px}
.hero h1{font-size:34px;line-height:1.08;font-weight:700;letter-spacing:.01em;margin:0 0 6px}
.hero p{margin:0;color:var(--mu);font-size:15px;line-height:1.35}
.hero div{min-width:0}
.card{background:var(--glass);-webkit-backdrop-filter:blur(30px) saturate(190%);backdrop-filter:blur(30px) saturate(190%);border:.5px solid rgba(255,255,255,.55);border-radius:28px;padding:20px;margin-bottom:18px;box-shadow:0 10px 34px var(--sh),inset 0 1px 0 rgba(255,255,255,.85),inset 0 -1px 0 rgba(255,255,255,.2)}
.step{display:flex;align-items:center;gap:10px;font-weight:600;font-size:19px;letter-spacing:-.02em;margin:0 0 16px}
.step .n{width:28px;height:28px;border-radius:50%;color:#fff;font-size:15px;font-weight:600;display:grid;place-items:center;flex:none;background:linear-gradient(180deg,#5ac8fa,#007aff);box-shadow:inset 0 1px 1px rgba(255,255,255,.7),0 3px 8px rgba(0,122,255,.35)}
.drop{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;text-align:center;padding:34px 16px;border:1.5px dashed var(--sep);border-radius:22px;background:var(--fld);cursor:pointer;transition:.2s}

async function load(file){
  $('c2').hidden=$('bar').hidden=true;logm('กำลังอ่านไฟล์…');
  try{
    if(typeof JSZip==='undefined')throw new Error('ไม่พบไลบรารี JSZip — กรุณาเปิดไฟล์ HTML ต้นฉบับอีกครั้ง');
    if(!/\.xlsx$/i.test(file.name))throw new Error('รองรับเฉพาะไฟล์ .xlsx');
    let zip;try{zip=await JSZip.loadAsync(file)}catch(_){throw new Error('เปิดไฟล์ไม่ได้ — ไฟล์อาจเสียหรือไม่ใช่ .xlsx')}
    const r=await parseReport(zip);
    if(!r.items.length)throw new Error('ไม่พบข้อมูลอุปกรณ์ในไฟล์นี้');
    items=r.items;footer=r.footer||'';docName=file.name.replace(/\.xlsx$/i,'').replace(/[_ -]*Report$/i,'')||'Report';
    if(r.title&&lsGet('thermify_title')==null)$('ttl').value=r.title;if(r.footer&&lsGet('thermify_footer')==null)$('ftr').value=r.footer;render();$('c2').hidden=$('bar').hidden=false;
    logm('<span class="ok">✓ อ่านไฟล์สำเร็จ '+r.items.length+' รายการ</span>'+(r.blank.length?'<br><span class="w">! ไม่มีชื่อตำแหน่ง/อุปกรณ์ (ใส่ "-" ให้แล้ว แก้ไขได้ในตาราง): No. '+r.blank.join(', ')+'</span>':''));
  }catch(e){logm('<span class="w">เกิดข้อผิดพลาด: '+eh(e.message)+'</span>')}
}

  $('go').disabled=true;$('gt').textContent='กำลังสร้าง…';
  try{
    if(typeof JSZip==='undefined')throw new Error('ไม่พบไลบรารี JSZip — กรุณาเปิดไฟล์ HTML ต้นฉบับอีกครั้ง');
    const blob=await buildSummary(JSZip,items,$('ttl').value.trim()||'Infrared Thermography Report',$('ftr').value,LOGO),a=document.createElement('a');
    a.href=URL.createObjectURL(blob);a.download=docName+'_Summary.xlsx';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),60000);
    logm('<span class="ok">✓ สร้างไฟล์ Summary เสร็จแล้ว — ไฟล์ถูกดาวน์โหลดอัตโนมัติ</span>');
  }catch(e){logm('<span class="w">เกิดข้อผิดพลาด: '+eh(e.message)+'</span>')}
  $('go').disabled=false;$('gt').textContent='สร้างไฟล์ Summary Excel';
};
</script></main></body></html>
